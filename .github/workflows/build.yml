name: Build Static Cheat Fork for SP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Compile Static Musl Binaries
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            messense/rust-musl-cross:aarch64-musl \
            sh -c 'rustup target add aarch64-unknown-linux-musl && cargo build --release --target aarch64-unknown-linux-musl -p slot -p slot-services --no-default-features --features slot/device'

      - name: Stage Distribution
        run: |
          mkdir -p dist/System/bin
          cp -f target/aarch64-unknown-linux-musl/release/slot dist/System/slot
          cp -f target/aarch64-unknown-linux-musl/release/slot dist/System/bin/slot
          cp -f target/aarch64-unknown-linux-musl/release/slot-services dist/System/slot-services
          cp -f target/aarch64-unknown-linux-musl/release/slot-services dist/System/bin/slot-services
          if [ -d "card/System" ]; then cp -r card/System/* dist/System/; fi
          if [ -d "card/Shaders" ]; then cp -r card/Shaders dist/; fi
          if [ -d "card/Audio" ]; then cp -r card/Audio dist/; fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slot-cheats-static
          path: dist/
